type: simplified_coding
max_rounds: 15
llm:
  type: ChatOpenAI
  model_name: google/gemini-2.5-pro
  max_tokens: 2048
  temperature: 0.1
  request_timeout: 60
  max_retries: 2
question_vlm:
  type: ChatOpenAI
  model_name: google/gemini-2.5-pro
  max_tokens: 64
  temperature: 0.3
  request_timeout: 30
  max_retries: 1
prompt_cfg:
  system: system_few_shot
  usage: usage
  user_question: user_question
  history: history
  final_try: final
  db:
    - train/qa.*
  retrieval:
    sentence_similarity_model: all-mpnet-base-v2
    top_k: 1
    question_modifier_llm:
      system_prompt: 'Replace every object- or task-specific phrase in the following question/command with X, so that only the basic question/command type remains. Example: When did you do X? describe what you did when X. Answer with only the modified question/command, no other text.'
      type: ChatOpenAI
      model_name: google/gemini-2.5-pro
      max_tokens: 64
      temperature: 0
      request_timeout: 15
      max_retries: 1
search:
  embedding: all-mpnet-base-v2
  use_faiss: true
  faiss_index_type: flat
  filter_kwargs:
    top_p: 0.3
    min_cos_sim: 0.4

# ============================================
# HBV 超维二进制向量配置
# ============================================
hbv:
  enabled: true
  dim: 10000
  device: cpu
  seed: 42
  image:
    grid_size: [16, 16]
    intensity_levels: 16
  text:
    ngram_size: 3
  action:
    thermometer_bits: 32
  search:
    pre_filter_k: 100
    use_dual_space: true
  consolidation:
    use_hbv_uniqueness: true
    redundancy_threshold: 0.15
    enable_hbv_compression: true
  correction:
    use_xor_correction: true
    propagation_threshold: 0.15
  active_perception:
    enabled: true
    uncertainty_threshold: 0.3
    max_attempts: 3

# ============================================
# 图增强检索配置
# ============================================
graph_augment:
  enable_temporal: true
  enable_co_object: true
  enable_co_location: true
  enable_similar_action: true
  similar_action_threshold: 0.85
  enable_causal: false
  alpha: 0.7
  beta: 0.25
  gamma: 0.05
  max_neighbors: 10
  adaptive_edge_selection: true

# ============================================
# 记忆巩固配置
# ============================================
forgetting:
  enabled: true
  alpha: 0.3
  beta: 0.3
  gamma: 0.4
  theta_1: 0.5
  theta_2: 0.2
  half_life: 3600.0
  min_retain_ratio: 0.3
  use_graph_centrality: true

api:
  include_groups:
    - dialog
    - util
    - tools
  include_names:
    - history
    - answer
exclude_imports:
  - history
  - wait_for_trigger
  - say

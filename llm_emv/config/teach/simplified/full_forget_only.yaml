type: simplified_coding
max_rounds: 15
llm:
  type: ChatOpenAI
  model_name: gemini-2.5-pro
  max_tokens: 2048
  temperature: 0.1
  request_timeout: 60
  max_retries: 2
question_vlm:
  type: ChatOpenAI
  model_name: gemini-2.5-pro
  max_tokens: 64
  temperature: 0.3
  request_timeout: 30
  max_retries: 1
prompt_cfg:
  system: system_few_shot
  usage: usage
  user_question: user_question
  history: history
  final_try: final
  db:
    - train/qa.*
  retrieval:
    sentence_similarity_model: all-mpnet-base-v2
    top_k: 1
    question_modifier_llm:
      system_prompt: 'Replace every object- or task-specific phrase in the following question/command with X, so that only the basic question/command type remains. Example: When did you do X? describe what you did when X. Answer with only the modified question/command, no other text.'
      type: ChatOpenAI
      model_name: gemini-2.5-pro
      max_tokens: 64
      temperature: 0
      request_timeout: 15
      max_retries: 1
search:
  embedding: all-mpnet-base-v2
  use_faiss: true
  faiss_index_type: flat
  filter_kwargs:
    top_p: 0.3
    min_cos_sim: 0.4

# ============================================
# 记忆巩固（遗忘机制）配置 — 仅遗忘，无图增强
# 用于消融实验：验证遗忘机制的独立效果
# ============================================
forgetting:
  enabled: true
  alpha: 0.3
  beta: 0.3
  gamma: 0.4
  theta_1: 0.5
  theta_2: 0.2
  half_life: 3600
  min_retain_ratio: 0.3
  use_graph_centrality: true

# 注意：此配置不包含 graph_augment 块，仅使用 FAISS 向量检索

api:
  include_groups:
    - dialog
    - util
    - tools
  include_names:
    - history
    - answer
exclude_imports:
  - history
  - wait_for_trigger
  - say

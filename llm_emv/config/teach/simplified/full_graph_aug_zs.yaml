type: simplified_coding
max_rounds: 15
llm:
  type: ChatOpenAI
  model_name: google/gemini-2.5-pro
  max_tokens: 2048
  temperature: 0.1
  request_timeout: 60
  max_retries: 2
question_vlm:
  type: ChatOpenAI
  model_name: google/gemini-2.5-pro
  max_tokens: 64
  temperature: 0.3
  request_timeout: 30
  max_retries: 1
prompt_cfg:
  system: system_zero_shot
  usage: usage
  user_question: user_question
  history: history
  final_try: final
  db: []
  retrieval:
    top_k: 0
search:
  embedding: all-mpnet-base-v2
  use_faiss: true
  faiss_index_type: flat
  filter_kwargs:
    top_p: 0.3
    min_cos_sim: 0.4

# ============================================
# 图增强检索配置
# ============================================
graph_augment:
  enable_temporal: true
  enable_co_object: true
  enable_co_location: true
  enable_similar_action: true
  similar_action_threshold: 0.85
  enable_causal: false
  alpha: 0.7
  beta: 0.25
  gamma: 0.05
  max_neighbors: 10
  adaptive_edge_selection: true

api:
  include_groups:
    - dialog
    - util
    - tools
  include_names:
    - history
    - answer
exclude_imports:
  - history
  - wait_for_trigger
  - say

type: simplified_coding
max_rounds: 15
llm:
  type: ChatOpenAI
  model_name: google/gemini-2.5-pro
  max_tokens: 2048
  temperature: 0.1
  request_timeout: 60
  max_retries: 2
question_vlm:
  type: ChatOpenAI
  model_name: google/gemini-2.5-pro
  max_tokens: 64
  temperature: 0.3
  request_timeout: 30
  max_retries: 1
prompt_cfg:
  system: system_few_shot
  usage: usage
  user_question: user_question
  history: history
  final_try: final
  db:
    - train/qa.*
  retrieval:
    sentence_similarity_model: all-mpnet-base-v2
    top_k: 1
    question_modifier_llm:
      system_prompt: 'Replace every object- or task-specific phrase in the following question/command with X, so that only the basic question/command type remains. Example: When did you do X? describe what you did when X. Answer with only the modified question/command, no other text.'
      type: ChatOpenAI
      model_name: google/gemini-2.5-pro
      max_tokens: 64
      temperature: 0
      request_timeout: 15
      max_retries: 1
search:
  embedding: all-mpnet-base-v2
  use_faiss: true
  faiss_index_type: flat
  filter_kwargs:
    top_p: 0.3
    min_cos_sim: 0.4

# ============================================
# 图增强检索配置
# ============================================
graph_augment:
  enable_temporal: true
  enable_co_object: true
  enable_co_location: true
  enable_similar_action: true
  similar_action_threshold: 0.85
  enable_causal: false
  alpha: 0.7
  beta: 0.25
  gamma: 0.05
  max_neighbors: 10
  adaptive_edge_selection: true

# ============================================
# 记忆修正配置（需配合 --enable-correction 使用）
# ============================================
correction:
  enabled: true
  # 修正 LLM（不配则复用主 LLM）
  correction_llm:
    type: ChatOpenAI
    model_name: google/gemini-2.5-pro
    max_tokens: 512
    temperature: 0.1
    request_timeout: 30
    max_retries: 2
  # 修正参数
  max_corrections: 3            # 每次最多修正的节点数
  suspicion_threshold: 0.3      # 嫌疑度阈值
  # 错误传播检测
  propagation_detection: true
  propagation_max_hops: 2       # 传播检测最大跳数
  propagation_similarity_threshold: 0.7  # 传播检测相似度阈值
  auto_propagate: true          # 是否自动修正传播错误

api:
  include_groups:
    - dialog
    - util
    - tools
  include_names:
    - history
    - answer
exclude_imports:
  - history
  - wait_for_trigger
  - say

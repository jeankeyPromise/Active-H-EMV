+include: full_graph_aug_zs_fast
graph_augment:
  enable_temporal: true
  enable_co_object: false
  enable_co_location: false
  enable_similar_action: false
  enable_causal: false
  alpha: 0.65
  beta: 0.30
  gamma: 0.05
  max_neighbors: 6
  max_seed_events_per_item: 2
  adaptive_edge_selection: true
prompt_cfg:
  system: system_zero_shot_no_tools
api:
  include_groups:
    - dialog
  include_names:
    - history
    - answer

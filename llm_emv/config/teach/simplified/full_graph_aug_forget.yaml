type: simplified_coding
max_rounds: 15
llm:
  type: ChatOpenAI
  model_name: google/gemini-2.5-pro
  max_tokens: 2048
  temperature: 0.1
  request_timeout: 60
  max_retries: 2
question_vlm:
  type: ChatOpenAI
  model_name: google/gemini-2.5-pro
  max_tokens: 64
  temperature: 0.3
  request_timeout: 30
  max_retries: 1
prompt_cfg:
  system: system_few_shot
  usage: usage
  user_question: user_question
  history: history
  final_try: final
  db:
    - train/qa.*
  retrieval:
    sentence_similarity_model: all-mpnet-base-v2
    top_k: 1
    question_modifier_llm:
      system_prompt: 'Replace every object- or task-specific phrase in the following question/command with X, so that only the basic question/command type remains. Example: When did you do X? describe what you did when X. Answer with only the modified question/command, no other text.'
      type: ChatOpenAI
      model_name: google/gemini-2.5-pro
      max_tokens: 64
      temperature: 0
      request_timeout: 15
      max_retries: 1
search:
  embedding: all-mpnet-base-v2
  use_faiss: true
  faiss_index_type: flat
  filter_kwargs:
    top_p: 0.3
    min_cos_sim: 0.4

# ============================================
# 记忆巩固（遗忘机制）配置
# ============================================
forgetting:
  enabled: true
  # 效用函数权重 (α + β + γ = 1.0)
  alpha: 0.3      # recency: 时间衰减权重
  beta: 0.3       # uniqueness: 语义独特性权重
  gamma: 0.4      # importance: 结构重要性权重
  # 遗忘阈值
  theta_1: 0.5    # U ≥ θ₁ → 完整保留 (Level 0)
  theta_2: 0.2    # U < θ₂ → 摘要保留 (Level 2)
  # 时间衰减参数
  half_life: 3600  # 半衰期（秒），1h 前的事件衰减到 0.5
  # 安全参数
  min_retain_ratio: 0.3  # 至少保留 30% 完整节点
  # 图度中心性
  use_graph_centrality: true

# ============================================
# 图增强检索配置
# ============================================
graph_augment:
  enable_temporal: true
  enable_co_object: true
  enable_co_location: true
  enable_similar_action: true
  similar_action_threshold: 0.85
  enable_causal: false
  alpha: 0.7
  beta: 0.25
  gamma: 0.05
  max_neighbors: 10
  adaptive_edge_selection: true

api:
  include_groups:
    - dialog
    - util
    - tools
  include_names:
    - history
    - answer
exclude_imports:
  - history
  - wait_for_trigger
  - say
